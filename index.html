<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Світлокарта будинків</title>
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Світлокарта">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%233ddc84'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  /* Layout: full-screen map; one glass panel on the left that morphs into a floating card (bottom sheet on phones) */
  :root {
    --bg: #0c0c0c;   /* same as the map's own background, so any strip the browser paints blends in */
    --glass: rgba(20, 22, 27, 0.72);
    --glass-strong: rgba(24, 26, 32, 0.88);
    --blur: blur(18px) saturate(1.3);
    --line: rgba(255, 255, 255, 0.08);
    --field: rgba(255, 255, 255, 0.06);
    --field-hover: rgba(255, 255, 255, 0.09);
    --fg: #e9ebee;
    --muted: #8d939c;
    --on: #3ddc84;
    --off: #ff4d4f;
    --idle: #5f6670;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --ease: cubic-bezier(0.32, 0.72, 0, 1);
    --panel-w: 320px;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; }
  html { background: var(--bg); overflow: hidden; overscroll-behavior: none; }
  /* The controls live in the visible area (dynamic viewport); the map alone fills the large viewport,
     so on iOS 26 Safari it keeps going under the floating address and tab bars, which blur it natively. */
  body { position: relative; height: 100dvh; overscroll-behavior: none; }
  [hidden] { display: none !important; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font); overflow: hidden; -webkit-font-smoothing: antialiased; }
  #map { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; height: 100lvh; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid rgba(255, 255, 255, 0.28); outline-offset: 1px; }

  /* ---- panel ---- */
  .side {
    --gap: 12px;
    position: absolute; z-index: 5;
    top: calc(var(--gap) + env(safe-area-inset-top, 0px)); left: calc(var(--gap) + env(safe-area-inset-left, 0px));
    width: var(--panel-w); height: calc(100% - 2 * var(--gap) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    box-sizing: border-box; overflow-x: hidden; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 16px;
    background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
    border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    transition: height .5s var(--ease);
  }
  .side.collapsed { height: var(--mini-h, 120px); overflow: visible; }
  .side.dragging { transition: none; }
  .grab { display: none; }
  .extra { transition: opacity .3s ease .18s, visibility 0s linear 0s; }
  .side.collapsed .extra { opacity: 0; visibility: hidden; transition: opacity .14s ease, visibility 0s linear .14s; }

  .row { display: flex; gap: 8px; }
  .btn {
    all: unset; box-sizing: border-box; flex: none; cursor: pointer; width: 36px; height: 36px; border-radius: 10px;
    display: grid; place-items: center; color: var(--muted); background: var(--field); transition: background .2s, color .2s;
  }
  .btn:hover { background: var(--field-hover); color: var(--fg); }
  .btn svg { width: 16px; height: 16px; }
  #toggle .i-expand, .side.collapsed #toggle .i-shrink { display: none; }
  .side.collapsed #toggle .i-expand { display: block; }
  .btn.small { width: 28px; height: 28px; border-radius: 8px; background: transparent; }
  .btn.small svg { width: 14px; height: 14px; }

  /* ---- fields + lists share one look ---- */
  .combo { position: relative; flex: 1; min-width: 0; }
  .field {
    width: 100%; height: 36px; box-sizing: border-box; padding: 0 34px 0 36px; border-radius: 10px;
    background: var(--field); border: 1px solid transparent; outline: none; font-size: 14px;
    transition: background .2s, border-color .2s;
  }
  .field::placeholder { color: var(--muted); }
  .field:hover { background: var(--field-hover); }
  .field:focus { background: var(--field-hover); border-color: rgba(255, 255, 255, 0.16); }
  .combo .ico { position: absolute; left: 12px; top: 50%; translate: 0 -50%; width: 15px; height: 15px; color: var(--muted); pointer-events: none; }
  .combo .field { padding-right: 12px; }
  .combo .field:not(:focus) { font-weight: 500; }

  .results {
    position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 10; margin: 0; padding: 4px; list-style: none;
    max-height: 320px; overflow-y: auto; border-radius: 12px; border: 1px solid var(--line);
    background: var(--glass-strong); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45); transform-origin: top center; animation: drop-in .2s var(--ease);
  }
  .results li { display: flex; align-items: center; gap: 10px; min-height: 32px; padding: 0 10px; border-radius: 8px; cursor: pointer; }
  .results li > span:not(.dot):not(.cnt) { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .results .cnt { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
  .results li[aria-selected="true"], .results li:hover { background: var(--field-hover); }
  .results .none { color: var(--muted); cursor: default; }
  .results .grp { min-height: 0; padding: 8px 10px 4px; font-size: 12px; color: var(--muted); cursor: default; }
  .results .grp:first-child { padding-top: 4px; }
  .results .grp:hover { background: none; }
  .results .none:hover { background: none; }

  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
  .dot.on { background: var(--on); } .dot.off { background: var(--off); } .dot.idle { background: var(--idle); }

  /* ---- numbers ---- */
  .summary { display: grid; gap: 10px; }
  .headline { margin: 0; font-size: 28px; font-weight: 600; line-height: 1.1; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
  .headline small { font-size: 14px; font-weight: 400; letter-spacing: 0; color: var(--muted); }
  .bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--field); }
  .bar span { height: 100%; transition: width .4s var(--ease); }
  .b-on { background: var(--on); } .b-off { background: var(--off); } .b-idle { background: var(--idle); }
  .facts { margin: 0; display: grid; gap: 4px; }
  .facts div { display: flex; justify-content: space-between; gap: 12px; }
  .facts dt { color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .facts dd { margin: 0; font-variant-numeric: tabular-nums; }
  .facts .cnt-n, .pie-row .cnt-n { color: var(--muted); }
  .facts > div:nth-child(4) { margin-top: 8px; }   /* the durations form their own group below the status rows */
  /* dot, label ... count, percent: the percent sits at the right edge in a fixed width so the counts line up */
  .facts dd, .pie-row .n { display: flex; align-items: baseline; gap: 10px; }
  .facts .pct, .pie-row .pct { min-width: 2.8em; text-align: right; color: var(--fg); font-weight: 500; font-variant-numeric: tabular-nums; }

  .list { display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 14px; }
  h2 { margin: 0; font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
  h2 span { font-weight: 400; color: var(--muted); }
  .rows { list-style: none; margin: 0 -8px; padding: 0; }
  .rows button { all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: grid; gap: 5px; padding: 7px 8px; border-radius: 8px; transition: background .2s; }
  .rows button:hover, .rows button[aria-current="true"] { background: var(--field); }
  .row-top { display: flex; justify-content: space-between; gap: 8px; }
  .row-top .n { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-top .p { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row-top .cnt-n { color: var(--muted); }
  .rows .bar { height: 4px; }
  .empty { margin: 0; color: var(--muted); font-size: 13px; }
  .foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }

  /* ---- popups: same glass as the panel ---- */
  .maplibregl-popup-tip { display: none; }
  .maplibregl-popup-content {
    background: var(--glass-strong); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
    color: var(--fg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
    font: 13px/1.45 var(--font); box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    transform-origin: bottom center; animation: pop-in .22s var(--ease) both;
  }
  .maplibregl-popup-anchor-top .maplibregl-popup-content, .maplibregl-popup-anchor-top-left .maplibregl-popup-content,
  .maplibregl-popup-anchor-top-right .maplibregl-popup-content { transform-origin: top center; }
  .maplibregl-popup.leaving .maplibregl-popup-content { animation: pop-out .16s ease forwards; }
  .hover-pop { pointer-events: none; }
  .maplibregl-popup { z-index: 100; }   /* above the city pies */

  /* city pies at region / country scale: on, off, no data */
  /* MapLibre positions the outer .pie with transform; only the inner disc animates, so the two never interfere */
  .pie { cursor: pointer; transition: opacity .3s ease; }
  .pie > span { display: block; width: 100%; height: 100%; border-radius: 50%; transition: transform .2s var(--ease);
    box-shadow: 0 0 0 1.5px rgba(12, 12, 12, .9), 0 2px 10px rgba(0, 0, 0, .5); }
  .pie:hover > span { transform: scale(1.12); }
  /* !important: MapLibre sets an inline opacity on every marker */
  .pop-item .pie-head { gap: 6px; margin: 0 0 4px; }
  .pie-row { display: flex; align-items: center; gap: 7px; }
  .pie-row .n { margin-left: auto; padding-left: 16px; font-variant-numeric: tabular-nums; }
  .pies-off .pie, .pie.pie-hide { opacity: 0 !important; pointer-events: none; }
  /* card = stacked full-bleed bands, one per channel, each faintly tinted by its own status */
  .maplibregl-popup-content { padding: 0; overflow: hidden; }
  .pop { display: grid; }
  .pop-item { display: grid; gap: 2px; padding: 10px 12px; }
  .pop-item + .pop-item { border-top: 1px solid var(--line); }
  .pop-item.st-on { background: rgba(61, 220, 132, .08); }
  .pop-item.st-off { background: rgba(255, 77, 79, .08); }
  .pop-state { display: flex; align-items: center; gap: 7px; }
  .pop-item:first-of-type .pop-state { margin-right: 22px; }
  .pop-state b { font-weight: 600; }
  .pop-state span:not(.dot) { color: var(--muted); font-variant-numeric: tabular-nums; }
  .pop-title { margin: 2px 0 0; }
  .pop-sub { color: var(--muted); font-size: 12px; }
  .pop-link { color: #8ab4f8; font-size: 12px; text-decoration: none; width: fit-content; }
  .pop-link:hover { text-decoration: underline; }
  .st-on .maplibregl-popup-content { border-color: rgba(61, 220, 132, .22); }
  .st-off .maplibregl-popup-content { border-color: rgba(255, 77, 79, .22); }
  .pop-x { all: unset; cursor: pointer; position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 6px;
    display: grid; place-items: center; color: var(--muted); font-size: 15px; line-height: 1; z-index: 1; }
  .pop-x:hover { background: var(--field-hover); color: var(--fg); }
  .hover-pop .pop-x { display: none; }

  @keyframes pop-in { from { opacity: 0; transform: scale(.94) translateY(4px); } to { opacity: 1; transform: none; } }
  @keyframes pop-out { to { opacity: 0; transform: scale(.97); } }
  @keyframes drop-in { from { opacity: 0; transform: scale(.98) translateY(-4px); } to { opacity: 1; transform: none; } }

  /* ---- map controls ---- */
  .map-ctrl { position: absolute; z-index: 4; top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); display: grid; gap: 8px; }
  .ctrl-group { display: grid; border-radius: 12px; overflow: hidden; border: 1px solid var(--line);
    background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3); }
  .ctrl-group button { all: unset; box-sizing: border-box; width: 36px; height: 36px; display: grid; place-items: center; cursor: pointer; color: var(--muted); transition: background .2s, color .2s; }
  .ctrl-group button + button { border-top: 1px solid var(--line); }
  .ctrl-group button:hover { background: var(--field); color: var(--fg); }
  .ctrl-group button:focus-visible { outline-offset: -2px; }
  .ctrl-group svg { width: 16px; height: 16px; }
  #locate.on { color: #8ab4f8; }
  #locate.err { color: var(--off); }
  #locate.busy svg { animation: blink 1s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  /* sources, always visible, one short line */
  .attrib { position: absolute; z-index: 3; margin: 0; right: calc(8px + env(safe-area-inset-right, 0px)); bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    padding: 2px 6px; border-radius: 6px; background: rgba(13, 15, 18, .6); color: var(--muted); font-size: 10.5px; line-height: 1.5; white-space: nowrap; }
  .attrib a { color: inherit; text-decoration: none; }
  .attrib a:hover { color: var(--fg); }

  @media (max-width: 560px) {
    .side { top: auto; bottom: calc(40px + env(safe-area-inset-bottom, 0px));
      width: calc(100% - 2 * var(--gap) - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
      height: calc(100% - 52px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); padding-top: 0; }
    .grab { display: flex; justify-content: center; flex: none; margin: 0 -16px -10px; padding: 8px 0 6px; cursor: grab; touch-action: none; }
    .grab span { width: 36px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.28); }
    #toggle { display: none; }
    .side.collapsed .results { top: auto; bottom: calc(100% + 6px); transform-origin: bottom center; }
    .attrib { font-size: 10px; right: 50%; translate: 50% 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
  }
</style>
</head>
<body>
<div id="map"></div>

<p class="attrib">
  <a href="https://svitlobot.in.ua" target="_blank" rel="noopener">Світлобот</a> ·
  <a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> ·
  <a href="https://www.openmaptiles.org/" target="_blank" rel="noopener">© OpenMapTiles</a> ·
  <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a>
</p>

<div class="map-ctrl">
  <div class="ctrl-group">
    <button id="zoom-in" type="button" aria-label="Наблизити" title="Наблизити"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9"/></svg></button>
    <button id="zoom-out" type="button" aria-label="Віддалити" title="Віддалити"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8h9"/></svg></button>
  </div>
  <div class="ctrl-group">
    <button id="locate" type="button" aria-label="Моє місце" title="Моє місце"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 2.5 2.5 7l4.6 1.9 1.9 4.6 4.5-11Z"/></svg></button>
  </div>
</div>

<aside class="side" id="side" aria-label="Світлокарта">
  <div class="grab" id="grab" role="button" tabindex="0" aria-label="Розгорнути або згорнути панель"><span></span></div>
  <div class="row">
    <div class="combo">
      <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
      <input class="field" id="q" type="text" role="combobox" aria-expanded="false" aria-controls="results" placeholder="Місто або адреса" autocomplete="off" spellcheck="false" aria-label="Місто або адреса">
      <ul class="results" id="results" role="listbox" hidden></ul>
    </div>
    <button class="btn" id="toggle" type="button" aria-label="Згорнути панель" aria-expanded="true"><svg class="i-expand" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 2.5h4v4M13.5 2.5 9 7M6.5 13.5h-4v-4M2.5 13.5 7 9"/></svg><svg class="i-shrink" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 6.5h-4v-4M9.5 6.5l4-4M2.5 9.5h4v4M6.5 9.5l-4 4"/></svg></button>
  </div>

  <section class="summary" id="summary" aria-live="polite">
    <p class="headline"><span id="a-off">—</span> <small>без світла</small></p>
    <div class="bar" id="a-bar"></div>
  </section>

  <dl class="facts extra">
    <div><dt><span class="dot on"></span>Світло є</dt><dd><span class="cnt-n" id="a-on-n">—</span><span class="pct" id="a-on-p">—</span></dd></div>
    <div><dt><span class="dot off"></span>Світла немає</dt><dd><span class="cnt-n" id="a-off-n">—</span><span class="pct" id="a-off-p">—</span></dd></div>
    <div><dt><span class="dot idle"></span>Немає даних</dt><dd><span class="cnt-n" id="a-idle-n">—</span><span class="pct" id="a-idle-p">—</span></dd></div>
    <div><dt>Медіана відключення</dt><dd id="a-median">—</dd></div>
    <div><dt>Найдовше відключення</dt><dd id="a-max">—</dd></div>
  </dl>

  <section class="list extra">
    <h2 id="list-title">Райони</h2>
    <ul class="rows" id="rows"></ul>
  </section>

  <footer class="foot extra">
    <span>Світлокарта · <span id="updated">завантаження…</span></span>
    <button class="btn small" id="refresh" type="button" aria-label="Оновити дані" title="Оновити"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.5-3.6"/><path d="M13 2.5v3h-3"/></svg></button>
  </footer>
</aside>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<!-- optional: building outlines prepared by build_buildings.py -->
<script src="buildings.js"></script>
<script>
const API = "https://api.svitlobot.in.ua/website/getChannelsForMap";
const STYLE = "https://tiles.openfreemap.org/styles/dark";
const BUILDING_ZOOM = 13;       // OpenMapTiles has building polygons from z13
const SNAP_METERS = 25;         // bot point outside any polygon: snap to nearest building within this radius
const REFRESH_MS = 60_000;

const COLORS = { on: "#3ddc84", off: "#ff4d4f", idle: "#6b7380" };
const stateOf = s => s === 1 ? "on" : s === 2 ? "off" : "idle";

let bots = [];                  // one entry per map point (a channel can have several connected points)
const matches = new Map();      // bot key -> { geom, dist }
const PRE = window.SVITLO_PRECOMPUTED || { houses: {}, districts: [] };
const coordKey = bot => `${+bot.lat.toFixed(6)},${+bot.lng.toFixed(6)}`;

function withBbox(m) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const [x, y] of m.geom.coordinates[0]) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  m.bbox = [x0, y0, x1, y1];
  return m;
}

// Outlines prepared ahead of time let houses show at every zoom, not only where tiles are loaded.
function seedFromPrecomputed() {
  for (const bot of bots) {
    if (matches.has(bot.key)) continue;
    const ring = PRE.houses[coordKey(bot)];
    if (ring) matches.set(bot.key, withBbox({ geom: { type: "Polygon", coordinates: [ring] }, dist: 0.5 }));
  }
}

// ---------- data ----------
function parseLine(line) {
  const p = line.split(";&&&;");
  if (p.length !== 12) return [];
  const status = parseInt(p[1], 10) || 0;
  const base = {
    status, state: stateOf(status),
    changed: new Date(p[2].trim()),
    title: p[3].trim(), link: p[4].trim(),
    city: p[3].includes("->") ? p[3].split("->")[0].trim().replace(/^(м\.|с\.|смт\.?|місто|село)\s*/i, "").replace(/[,.\s]+$/, "") || "Інше" : "Інше",
    users: parseInt(p[5], 10) || 0,
    group: p[9].trim(),
  };
  const pts = [{ name: base.title, lat: parseFloat(p[6]), lng: parseFloat(p[7]) }];
  for (const raw of p[11].trim().split(";&&;")) {
    const q = raw.split(";&;");
    if (q.length === 3) pts.push({ name: q[0].trim(), lat: parseFloat(q[1]), lng: parseFloat(q[2]) });
  }
  return pts.filter(pt => isFinite(pt.lat) && isFinite(pt.lng))
            .map((pt, i) => ({ ...base, key: base.link + "#" + i, pointName: pt.name, lat: pt.lat, lng: pt.lng }));
}

async function loadBots() {
  setUpdated("Завантаження…");
  try {
    const res = await fetch(API, { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const text = await res.text();
    bots = text.split("\n").flatMap(parseLine);
    const at = res.headers.get("x-cache-updated-at") || res.headers.get("last-modified");
    const t = at ? new Date(at) : new Date();
    setUpdated("оновлено о " + t.toLocaleTimeString("uk-UA", { hour: "2-digit", minute: "2-digit" }));
    seedFromPrecomputed();
    assignDistricts();
    rematchAll();
    renderSide();
    renderPies();
    if (!loadBots.done) { loadBots.done = true; if (area) fitBots(channels().filter(b => b.city === area)); }
  } catch (e) {
    setUpdated("дані не отримано, спробуйте ще");
  }
}
function setUpdated(t) { document.getElementById("updated").textContent = t; }

// ---------- geometry ----------
function inRing(x, y, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i], [xj, yj] = ring[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function inPolygon(x, y, rings) { let c = false; for (const r of rings) if (inRing(x, y, r)) c = !c; return c; }
function segDist2(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy;
  let t = l ? ((px - ax) * dx + (py - ay) * dy) / l : 0;
  t = Math.max(0, Math.min(1, t));
  const ex = ax + t * dx - px, ey = ay + t * dy - py;
  return ex * ex + ey * ey;
}
// distance in metres from point to polygon boundary (local equirectangular projection)
function distMeters(lng, lat, rings) {
  const kx = 111320 * Math.cos(lat * Math.PI / 180), ky = 110540;
  let best = Infinity;
  for (const r of rings) for (let i = 1; i < r.length; i++) {
    best = Math.min(best, segDist2(0, 0, (r[i-1][0]-lng)*kx, (r[i-1][1]-lat)*ky, (r[i][0]-lng)*kx, (r[i][1]-lat)*ky));
  }
  return Math.sqrt(best);
}

// Look through building polygons from loaded tiles and attach each bot to the building it sits in.
function matchBuildings() {
  if (!map.getSource("openmaptiles") || map.getZoom() < BUILDING_ZOOM - 0.5 || !bots.length) return;
  const b = map.getBounds();
  const pad = 0.01;
  const CELL = 0.002;
  const grid = new Map();
  for (const bot of bots) {
    if (bot.lng < b.getWest() - pad || bot.lng > b.getEast() + pad || bot.lat < b.getSouth() - pad || bot.lat > b.getNorth() + pad) continue;
    const m = matches.get(bot.key);
    if (m && m.dist === 0) continue;
    const k = Math.floor(bot.lng / CELL) + ":" + Math.floor(bot.lat / CELL);
    (grid.get(k) || grid.set(k, []).get(k)).push(bot);
  }
  if (!grid.size) return;

  const feats = map.querySourceFeatures("openmaptiles", { sourceLayer: "building" });
  const snapDeg = SNAP_METERS / 70000;
  let changed = false;
  for (const f of feats) {
    const g = f.geometry;
    const polys = g.type === "Polygon" ? [g.coordinates] : g.type === "MultiPolygon" ? g.coordinates : [];
    for (const rings of polys) {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const [x, y] of rings[0]) { if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; }
      const cx0 = Math.floor((minX - snapDeg) / CELL), cx1 = Math.floor((maxX + snapDeg) / CELL);
      const cy0 = Math.floor((minY - snapDeg) / CELL), cy1 = Math.floor((maxY + snapDeg) / CELL);
      for (let cx = cx0; cx <= cx1; cx++) for (let cy = cy0; cy <= cy1; cy++) {
        const cell = grid.get(cx + ":" + cy);
        if (!cell) continue;
        for (const bot of cell) {
          if (bot.lng < minX - snapDeg || bot.lng > maxX + snapDeg || bot.lat < minY - snapDeg || bot.lat > maxY + snapDeg) continue;
          const prev = matches.get(bot.key);
          if (prev && prev.dist === 0) continue;
          let d = inPolygon(bot.lng, bot.lat, rings) ? 0 : distMeters(bot.lng, bot.lat, rings);
          if (d <= SNAP_METERS && (!prev || d < prev.dist)) {
            matches.set(bot.key, withBbox({ geom: { type: "Polygon", coordinates: rings }, dist: d }));
            changed = true;
          }
        }
      }
    }
  }
  if (changed) render();
}

function rematchAll() { render(); matchBuildings(); }

// ---------- rendering ----------
const sameHouse = new Map();   // house outline -> bots attached to it
function render() {
  const houses = [], points = [];
  sameHouse.clear();
  for (const bot of bots) {
    const m = matches.get(bot.key);
    bot.houseKey = m ? m.geom.coordinates[0].slice(0, 3).join(";") : null;
    if (m) (sameHouse.get(bot.houseKey) || sameHouse.set(bot.houseKey, []).get(bot.houseKey)).push(bot);
    const props = { key: bot.key, state: bot.state, matched: !!m };
    if (m) houses.push({ type: "Feature", geometry: m.geom, properties: props });
    points.push({ type: "Feature", geometry: { type: "Point", coordinates: [bot.lng, bot.lat] }, properties: props });
  }
  // draw the "off" buildings last so they stay visible where neighbours overlap
  houses.sort((a, b) => (a.properties.state === "off") - (b.properties.state === "off"));
  map.getSource("houses")?.setData({ type: "FeatureCollection", features: houses });
  map.getSource("bots")?.setData({ type: "FeatureCollection", features: points });
}

// ---------- popup ----------
function duration(from) {
  let m = Math.max(0, Math.floor((Date.now() - from) / 60000));
  const d = Math.floor(m / 1440); m -= d * 1440;
  const h = Math.floor(m / 60); m -= h * 60;
  return (d ? d + " д " : "") + (d || h ? h + " год " : "") + m + " хв";
}
function esc(s) { return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function stateLine(bot) {
  if (bot.state === "on") {
    const old = Date.now() - bot.changed >= (24 * 60 - 10) * 60000;
    return `<b>Світло є</b><span>${old ? "понад добу" : duration(bot.changed)}</span>`;
  }
  if (bot.state === "off") return `<b>Світла немає</b><span>${duration(bot.changed)}</span>`;
  return `<b>${bot.status === 0 ? "Систему ще не запущено" : "Технічна перерва"}</b>`;
}
// One card for every bot under the cursor: status first, then address, then the channel.
function popupHtml(group) {
  let prevAddr = null;
  const items = group.map(bot => {
    const addr = bot.title.includes("->") ? bot.title.split("->").slice(1).join("->").trim() : bot.title;
    const point = bot.pointName && bot.pointName !== bot.title ? bot.pointName : "";
    const meta = [bot.city !== "Інше" ? bot.city : "", bot.users ? bot.users + " підписників" : "", bot.group && bot.group !== "-" ? bot.group : ""].filter(Boolean).join(" · ");
    const sameAddr = addr === prevAddr; prevAddr = addr;
    return `<section class="pop-item st-${bot.state}">
      <div class="pop-state"><span class="dot ${bot.state}"></span>${stateLine(bot)}</div>
      ${sameAddr ? "" : `<p class="pop-title">${esc(addr)}</p>`}
      ${point ? `<div class="pop-sub">${esc(point)}</div>` : ""}
      ${meta ? `<div class="pop-sub">${esc(meta)}</div>` : ""}
      ${bot.link ? `<a class="pop-link" href="https://t.me/${encodeURIComponent(bot.link)}" target="_blank" rel="noopener">t.me/${esc(bot.link)}</a>` : ""}
    </section>`;
  }).join("");
  return `<div class="pop"><button class="pop-x" type="button" aria-label="Закрити">×</button>${items}</div>`;
}

// Houses (or loose bot dots) within HIT_PX screen pixels of the cursor; inside a house counts as 0.
const HIT_PX = matchMedia("(pointer: coarse)").matches ? 22 : 14;
function screenDist(f, pt) {
  const g = f.geometry;
  if (g.type === "Point") { const c = map.project(g.coordinates); return Math.max(0, Math.hypot(c.x - pt.x, c.y - pt.y) - 5); }
  const polys = g.type === "Polygon" ? [g.coordinates] : g.type === "MultiPolygon" ? g.coordinates : [];
  let best = Infinity;
  for (const rings of polys) {
    const scr = rings.map(r => r.map(c => { const q = map.project(c); return [q.x, q.y]; }));
    if (inPolygon(pt.x, pt.y, scr)) return 0;
    for (const r of scr) for (let i = 1; i < r.length; i++) {
      best = Math.min(best, Math.sqrt(segDist2(pt.x, pt.y, r[i - 1][0], r[i - 1][1], r[i][0], r[i][1])));
    }
  }
  return best;
}
function pickGroup(pt, current) {
  if (map.getZoom() < PIE_MAX_ZOOM) return null;   // houses (and their cards) only exist from city scale
  // Measured from our own data rather than rendered features: the map returns only one of several identical outlines.
  const a = map.unproject([pt.x - HIT_PX, pt.y + HIT_PX]), c = map.unproject([pt.x + HIT_PX, pt.y - HIT_PX]);
  const looseDots = map.getZoom() >= 15;
  const dist = new Map();   // bot key -> distance in screen px
  for (const b of bots) {
    const m = matches.get(b.key);
    let d;
    if (m) {
      const [x0, y0, x1, y1] = m.bbox;
      if (x1 < a.lng || x0 > c.lng || y1 < a.lat || y0 > c.lat) continue;
      d = screenDist({ geometry: m.geom }, pt);
    } else {
      if (!looseDots || b.lng < a.lng || b.lng > c.lng || b.lat < a.lat || b.lat > c.lat) continue;
      d = screenDist({ geometry: { type: "Point", coordinates: [b.lng, b.lat] } }, pt);
    }
    if (d <= HIT_PX) dist.set(b.key, d);
  }
  if (!dist.size) return null;
  const best = Math.min(...dist.values());
  // Stay on the card already shown while the cursor is still near it, unless it is now inside another house.
  if (current) {
    const cur = Math.min(...current.map(b => dist.get(b.key) ?? Infinity));
    if (cur <= HIT_PX && !(best === 0 && cur > 0)) return current;
  }
  // One card = one address: the nearest bot, plus other bots nearby or in the same house with that exact address.
  const nearest = bots.find(b => b.key === [...dist].find(([, d]) => d === best)[0]);
  return addressGroup(nearest, [...dist.keys()].map(key => bots.find(b => b.key === key)));
}
function addressGroup(nearest, nearby = []) {
  const addr = addrKey(nearest);
  const seen = new Set();
  const sameAddr = bots.filter(b => b.city === nearest.city && addrKey(b) === addr &&
    Math.abs(b.lat - nearest.lat) < 0.003 && Math.abs(b.lng - nearest.lng) < 0.0045);   // same address within ~300 m
  return [nearest, ...nearby, ...botsInHouse(nearest), ...sameAddr]
    .filter(b => b && addrKey(b) === addr && !seen.has(b.link) && seen.add(b.link))
    // most subscribers first; bots without a live status always go last
    .sort((a, b) => (a.state === "idle") - (b.state === "idle") || b.users - a.users);
}
// The bot itself plus every other bot attached to the same outline or standing inside it.
function botsInHouse(bot) {
  const m = matches.get(bot.key);
  if (!m) return [bot];
  const [x0, y0, x1, y1] = m.bbox;
  const out = [bot, ...(sameHouse.get(bot.houseKey) || [])];
  for (const b of bots) {
    if (b === bot || b.lng < x0 || b.lng > x1 || b.lat < y0 || b.lat > y1) continue;
    if (inPolygon(b.lng, b.lat, m.geom.coordinates)) out.push(b);
  }
  return out;
}
// "м. Київ, вул. Регенераторна, 4" and "Київ -> Регенераторна 4" compare equal
function addrKey(b) {
  const a = b.title.includes("->") ? b.title.split("->").slice(1).join(" ") : b.title;
  return a.toLowerCase().replace(/(?<!\p{L})(м|вул|вулиця|просп|проспект|пров|провулок|бул|бульвар|пл|площа)(?!\p{L})\.?/gu, " ")
    .replace(new RegExp("^\\s*" + b.city.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g, "\\$&")), "")
    .replace(/[^\p{L}\p{N}/]+/gu, "");
}
const groupKey = g => g.map(b => b.key).sort().join("|");

// Hover shows a card that fades away; a click pins one until it is closed.
let hover = null, pinned = null;
function fadeOut(popup) {
  if (!popup) return;
  popup.getElement()?.classList.add("leaving");
  setTimeout(() => popup.remove(), 160);
}
function makePopup(group, lngLat, hovering) {
  const p = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 12, maxWidth: "300px" })
    .setLngLat(lngLat).setHTML(popupHtml(group)).addTo(map);
  // the border picks up the status colour only when every block agrees
  if (new Set(group.map(b => b.state)).size === 1) p.addClassName("st-" + group[0].state);
  if (hovering) p.addClassName("hover-pop");
  p.key = groupKey(group); p.group = group;
  return p;
}
function hoverPopup(group, lngLat) {
  const key = groupKey(group);
  if (pinned?.key === key) { fadeOut(hover); hover = null; return; }
  if (hover?.key === key) return;
  fadeOut(hover);
  hover = makePopup(group, lngLat, true);
}
function pinPopup(group, lngLat) {
  fadeOut(hover); hover = null;
  if (pinned?.key === groupKey(group)) return;
  fadeOut(pinned);
  const p = makePopup(group, lngLat, false);
  p.getElement().querySelector(".pop-x").onclick = () => { if (pinned === p) closePinned(); else fadeOut(p); };
  pinned = p;
}
// Closing the card also clears an address typed into the search.
function closePinned() {
  fadeOut(pinned); pinned = null;
  const q = document.getElementById("q");
  if (document.activeElement !== q) q.value = area ?? "Уся Україна";
}
document.addEventListener("keydown", e => { if (e.key === "Escape" && pinned) closePinned(); });

// ---------- districts & side panel ----------
const DISTRICTS = (PRE.districtPolys || []).map((d, i) => {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const r of d.rings) for (const [x, y] of r) { minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y); }
  return { id: i, name: d.name, rings: d.rings, bbox: [minX, minY, maxX, maxY], city: null };
});
let area = null;       // selected city name, or null for all of Ukraine
let selDistrict = null;
area = "Київ";          // the map always opens on Kyiv

// Each channel counts once, by its main point.
const channels = () => bots.filter(b => b.key.endsWith("#0"));

function assignDistricts() {
  const votes = DISTRICTS.map(() => ({}));
  for (const bot of channels()) {
    bot.district = null;
    for (const d of DISTRICTS) {
      const [x0, y0, x1, y1] = d.bbox;
      if (bot.lng < x0 || bot.lng > x1 || bot.lat < y0 || bot.lat > y1 || !inPolygon(bot.lng, bot.lat, d.rings)) continue;
      bot.district = d.id;
      votes[d.id][bot.city] = (votes[d.id][bot.city] || 0) + 1;
      break;
    }
  }
  // a district belongs to the city most of its bots name
  DISTRICTS.forEach((d, i) => { d.city = Object.entries(votes[i]).sort((a, b) => b[1] - a[1])[0]?.[0] ?? null; });
}

function summarize(list) {
  const on = list.filter(b => b.state === "on").length;
  const offList = list.filter(b => b.state === "off");
  const off = offList.length, idle = list.length - on - off;
  const mins = offList.map(b => (Date.now() - b.changed) / 60000).sort((a, b) => a - b);
  return { on, off, idle, total: list.length, known: on + off,
           median: mins.length ? mins[Math.floor(mins.length / 2)] : null, max: mins.length ? mins.at(-1) : null };
}
const pctOff = s => s.known ? Math.round(s.off / s.known * 100) : null;
function fmtMin(m) {
  if (m == null) return "—";
  m = Math.floor(m);
  const d = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60), mm = m % 60;
  return d ? `${d} д ${h} год` : h ? `${h} год ${mm} хв` : `${mm} хв`;
}
function barHtml(s) {
  if (!s.total) return "";
  const w = n => (n / s.total * 100).toFixed(2) + "%";
  return `<span class="b-on" style="width:${w(s.on)}"></span><span class="b-off" style="width:${w(s.off)}"></span><span class="b-idle" style="width:${w(s.idle)}"></span>`;
}
function rowHtml(name, s) {
  const p = pctOff(s);
  return `<div class="row-top"><span class="n">${esc(name)}</span><span class="p">${p ?? "—"}%<span class="cnt-n"> · ${s.off}/${s.known}</span></span></div><div class="bar">${barHtml(s)}</div>`;
}

function renderSide() {
  const all = channels();
  const byCity = {};
  for (const b of all) (byCity[b.city] ||= []).push(b);
  const cities = Object.keys(byCity).filter(c => c !== "Інше").sort((a, b) => byCity[b].length - byCity[a].length);
  if (area && !byCity[area]) area = null;

  cityOptions = [{ value: "", label: "Уся Україна", count: all.length }, ...cities.map(c => ({ value: c, label: c, count: byCity[c].length }))];
  if (document.activeElement !== q) q.value = area ?? "Уся Україна";

  const scopeBots = area ? byCity[area] : all;
  const s = summarize(scopeBots);
  const p = pctOff(s);
  document.getElementById("a-off").textContent = p == null ? "—" : p + "%";
  document.getElementById("a-bar").innerHTML = barHtml(s);
  measureMini();
  // on/off shares match the headline (bots with a status); "no data" is a share of all bots
  const share = (id, n, of) => {
    document.getElementById(id + "-p").textContent = of ? Math.round(n / of * 100) + "%" : "—";
    document.getElementById(id + "-n").textContent = n;
  };
  share("a-on", s.on, s.known);
  share("a-off", s.off, s.known);
  share("a-idle", s.idle, s.total);
  document.getElementById("a-median").textContent = fmtMin(s.median);
  document.getElementById("a-max").textContent = fmtMin(s.max);

  const rows = document.getElementById("rows"), title = document.getElementById("list-title");
  rows.innerHTML = "";
  let items;
  if (area) {
    title.textContent = "Райони";
    items = DISTRICTS.filter(d => d.city === area)
      .map(d => ({ name: d.name.replace(/\s+район$/, ""), s: summarize(scopeBots.filter(b => b.district === d.id)), district: d }));
    items.sort((a, b) => (pctOff(b.s) ?? -1) - (pctOff(a.s) ?? -1));
    const outside = scopeBots.filter(b => b.district == null);
    if (items.length && outside.length) items.push({ name: "Поза межами районів", s: summarize(outside), bots: outside });
  } else {
    title.textContent = "Міста";
    items = cities.slice(0, 40).map(c => ({ name: c, s: summarize(byCity[c]), city: c }));
  }
  title.parentElement.hidden = !items.length;   // a city without districts simply has no list
  for (const it of items) {
    const li = document.createElement("li"), btn = document.createElement("button");
    btn.type = "button";
    btn.innerHTML = rowHtml(it.name, it.s);
    if (it.district) btn.setAttribute("aria-current", String(selDistrict === it.district.id));
    btn.onclick = () => {
      if (it.city) { setArea(it.city); return; }
      if (it.district) { selectDistrict(it.district); renderSide(); return; }
      revealMap(); fitBots(it.bots);
    };
    li.appendChild(btn); rows.appendChild(li);
  }
}

// Padding so fitted areas are centred in the part of the map the panel doesn't cover.
function viewPadding(base = 40) {
  // part of the map that runs under the browser's bottom bar (large viewport taller than the visible one)
  const underBars = Math.max(0, document.getElementById("map").clientHeight - document.body.clientHeight);
  const pad = { top: base, right: base, bottom: base + underBars, left: base };
  const side = document.getElementById("side");
  const collapsed = side.classList.contains("collapsed");
  const miniH = parseFloat(side.style.getPropertyValue("--mini-h")) || 120;
  if (matchMedia("(max-width: 560px)").matches) pad.bottom += miniH + 40;   // on phones the map is shown with the sheet compact
  else if (collapsed) pad.top += miniH + 12;
  else pad.left += side.offsetWidth + 12;
  return pad;
}

function fitBots(list) {
  if (!list?.length) return;
  // trim stray outliers so one mislocated bot doesn't zoom out to the whole country
  const xs = list.map(b => b.lng).sort((a, b) => a - b), ys = list.map(b => b.lat).sort((a, b) => a - b);
  const q = (a, f) => a[Math.min(a.length - 1, Math.max(0, Math.round(f * (a.length - 1))))];
  const t = list.length > 20 ? 0.02 : 0;
  map.fitBounds([[q(xs, t), q(ys, t)], [q(xs, 1 - t), q(ys, 1 - t)]], { padding: viewPadding(60), maxZoom: 15 });
}
// On phones, choosing a place folds the sheet down so the map can be seen.
function revealMap() { if (matchMedia("(max-width: 560px)").matches && !side.classList.contains("collapsed")) setSide(false); }
function setArea(city) {
  revealMap();
  area = city || null; selDistrict = null;
  highlightDistrict();
  renderSide();
  if (area) fitBots(channels().filter(b => b.city === area));
  else map.fitBounds([[22.1, 44.4], [40.2, 52.4]], { padding: viewPadding(20) });
}
function selectDistrict(d) {
  selDistrict = selDistrict === d.id ? null : d.id;
  highlightDistrict();
  if (selDistrict != null) revealMap();
  if (selDistrict != null) map.fitBounds([[d.bbox[0], d.bbox[1]], [d.bbox[2], d.bbox[3]]], { padding: viewPadding(40) });
}
function highlightDistrict() {
  map.getLayer("district-sel") && map.setFilter("district-sel", ["==", ["get", "id"], selDistrict ?? -1]);
}

const PIE_MAX_ZOOM = 9;   // below: city pies; from here on: districts and houses

// ---------- map ----------
const map = new maplibregl.Map({
  container: "map", style: STYLE,
  center: [30.523, 50.450], zoom: 13.5, maxZoom: 19, attributionControl: false,
});

// Zoom and "my location" buttons drawn in the same style as the panel.
document.getElementById("zoom-in").onclick = () => map.zoomIn();
document.getElementById("zoom-out").onclick = () => map.zoomOut();
{
  const btn = document.getElementById("locate");
  const me = { type: "FeatureCollection", features: [] };
  btn.onclick = () => {
    if (!navigator.geolocation) { btn.classList.add("err"); btn.title = "Геолокація недоступна в цьому браузері"; return; }
    btn.classList.remove("err"); btn.classList.add("busy");
    navigator.geolocation.getCurrentPosition(pos => {
      btn.classList.remove("busy"); btn.classList.add("on"); btn.title = "Моє місце";
      const at = [pos.coords.longitude, pos.coords.latitude];
      me.features = [{ type: "Feature", geometry: { type: "Point", coordinates: at }, properties: {} }];
      map.getSource("me")?.setData(me);
      revealMap();
      map.flyTo({ center: at, zoom: Math.max(map.getZoom(), 16), padding: viewPadding(0) });
    }, () => {
      btn.classList.remove("busy", "on"); btn.classList.add("err");
      btn.title = "Не вдалося визначити місце. Дозвольте доступ до геолокації в браузері.";
    }, { enableHighAccuracy: true, timeout: 10000 });
  };
  map.on("load", () => {
    map.addSource("me", { type: "geojson", data: me });
    map.addLayer({ id: "me-halo", type: "circle", source: "me", paint: { "circle-radius": 14, "circle-color": "#8ab4f8", "circle-opacity": 0.18 } });
    map.addLayer({ id: "me-dot", type: "circle", source: "me",
      paint: { "circle-radius": 6, "circle-color": "#8ab4f8", "circle-stroke-color": "#ffffff", "circle-stroke-width": 2 } });
  });
}

map.on("load", () => {
  // Calm, uniform grey for every building; colour is reserved for buildings with a bot.
  const style = map.getStyle();
  for (const l of style.layers) {
    if (l.id === "building") {
      map.setPaintProperty(l.id, "fill-color", "#23272e");
      map.setPaintProperty(l.id, "fill-outline-color", "#2d323a");
    }
    if (l.type === "symbol" && l.layout && l.layout["text-field"]) {
      map.setLayoutProperty(l.id, "text-field", ["coalesce", ["get", "name:uk"], ["get", "name"]]);
    }
  }

  map.addSource("houses", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addSource("bots", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  const color = ["match", ["get", "state"], "on", COLORS.on, "off", COLORS.off, COLORS.idle];
  // put coloured houses right above the grey base buildings, below roads and labels drawn after them
  const bIdx = style.layers.findIndex(l => l.id === "building");
  const firstLabel = style.layers[bIdx + 1]?.id;

  // houses from city scale; further out the city pies stand in for them
  map.addLayer({ id: "houses-fill", type: "fill", source: "houses", minzoom: PIE_MAX_ZOOM,
    paint: { "fill-color": color, "fill-opacity": ["match", ["get", "state"], "idle", 0.45, 0.82] } }, firstLabel);
  map.addLayer({ id: "houses-line", type: "line", source: "houses", minzoom: PIE_MAX_ZOOM,
    paint: { "line-color": color, "line-width": ["interpolate", ["linear"], ["zoom"], 8, 1.6, 12, 1.2, 14, 0.6, 17, 2] } }, firstLabel);

  // A dot appears only for a bot whose building is unknown, and only up close.
  map.addLayer({ id: "bots-near", type: "circle", source: "bots", minzoom: 15,
    filter: ["!", ["get", "matched"]],
    paint: { "circle-color": color, "circle-radius": 5, "circle-stroke-color": "#0b0d10", "circle-stroke-width": 1.5 } });

  // Hover and click use a forgiving hit area, so small or intricate buildings are easy to reach.
  let moveFrame = 0, lastMove = null;
  map.on("mousemove", e => {
    lastMove = e;
    if (moveFrame) return;
    moveFrame = requestAnimationFrame(() => {
      moveFrame = 0;
      const group = pickGroup(lastMove.point, hover?.group);
      map.getCanvas().style.cursor = group ? "pointer" : "";
      if (group) hoverPopup(group, lastMove.lngLat);
      else { fadeOut(hover); hover = null; }
    });
  });
  map.getCanvas().addEventListener("mouseleave", () => { fadeOut(hover); hover = null; });
  map.on("click", e => {
    const group = pickGroup(e.point, hover?.group);
    if (group) pinPopup(group, hover?.key === groupKey(group) ? hover.getLngLat() : e.lngLat);
    else closePinned();   // a click on empty map closes the card and clears the search
  });

  // City district outlines, prepared by build_buildings.py so they stay visible at every zoom
  map.addSource("district-lines", { type: "geojson", data: { type: "Feature", properties: {},
    geometry: { type: "MultiLineString", coordinates: PRE.districtLines || [] } } });
  // districts appear at city scale and stay hidden at region or country scale
  map.addLayer({ id: "districts-line", type: "line", source: "district-lines", minzoom: 9,
    layout: { "line-join": "round", "line-cap": "round" },
    paint: { "line-color": "#ffffff", "line-opacity": ["interpolate", ["linear"], ["zoom"], 9, 0, 10, 0.5, 12, 0.7],
             "line-width": ["interpolate", ["linear"], ["zoom"], 6, 0.6, 10, 1, 14, 2] } });
  map.addSource("district-polys", { type: "geojson", data: { type: "FeatureCollection",
    features: DISTRICTS.map(d => ({ type: "Feature", properties: { id: d.id }, geometry: { type: "Polygon", coordinates: d.rings } })) } });
  map.addLayer({ id: "district-sel", type: "line", source: "district-polys", filter: ["==", ["get", "id"], -1],
    paint: { "line-color": "#ffffff", "line-width": 3.5, "line-blur": 0.5 } });
  const labelFont = style.layers.find(l => l.type === "symbol" && l.layout?.["text-font"])?.layout["text-font"] || ["Noto Sans Regular"];
  map.addSource("district-labels", { type: "geojson", data: { type: "FeatureCollection",
    features: PRE.districts.map(d => ({ type: "Feature", geometry: { type: "Point", coordinates: [d.lng, d.lat] }, properties: { name: d.name } })) } });
  map.addLayer({ id: "districts-label", type: "symbol", source: "district-labels", minzoom: 9.5, maxzoom: 15,
    layout: { "text-field": ["get", "name"], "text-font": labelFont, "text-size": ["interpolate", ["linear"], ["zoom"], 10, 11, 14, 13],
              "text-max-width": 8 },
    paint: { "text-color": "#ffffff", "text-opacity": 0.6, "text-halo-color": "#0b0d10", "text-halo-width": 1.5 } });

  loadBots();
  setInterval(loadBots, REFRESH_MS);
});

// ---------- city pies (zoomed out to region or country) ----------

const pies = new Map();   // city -> { marker, el, list }
function renderPies() {
  const byCity = {};
  for (const b of channels()) if (b.city !== "Інше") (byCity[b.city] ||= []).push(b);
  for (const [city, pie] of pies) if (!byCity[city]) { pie.marker.remove(); pies.delete(city); }
  for (const [city, list] of Object.entries(byCity)) {
    const s = summarize(list);
    if (!s.total) continue;
    // centre on the median bot so a stray far point doesn't drag the pie away
    const mid = a => a.sort((x, y) => x - y)[Math.floor(a.length / 2)];
    const at = [mid(list.map(b => b.lng)), mid(list.map(b => b.lat))];
    const size = Math.round(Math.min(44, 10 + Math.sqrt(s.total) * 2.2));
    let pie = pies.get(city);
    if (!pie) {
      const el = document.createElement("div");
      el.className = "pie";
      el.appendChild(document.createElement("span"));
      el.setAttribute("role", "button");
      el.setAttribute("aria-label", city);
      pie = { el, marker: new maplibregl.Marker({ element: el }).setLngLat(at).addTo(map) };
      el.addEventListener("mouseenter", () => showPieCard(city));
      el.addEventListener("mouseleave", () => { fadeOut(pieCard); pieCard = null; });
      el.addEventListener("click", e => { e.stopPropagation(); fadeOut(pieCard); pieCard = null; setArea(city); });
      pies.set(city, pie);
    }
    pie.list = list; pie.total = s.total;
    pie.marker.setLngLat(at);
    const on = s.on / s.total * 100, off = on + s.off / s.total * 100;
    Object.assign(pie.el.style, { width: size + "px", height: size + "px", zIndex: String(size) });   // bigger cities sit on top
    pie.el.firstChild.style.background = `conic-gradient(var(--on) 0 ${on}%, var(--off) ${on}% ${off}%, var(--idle) ${off}% 100%)`;
  }
  updatePies();
}
// Only places with enough bots get a pie: a pie of one bot is just a dot, and suburbs would bury their city.
function updatePies() {
  const z = map.getZoom();
  map.getContainer().classList.toggle("pies-off", z >= PIE_MAX_ZOOM);
  const min = z < 7 ? 8 : z < 8 ? 3 : 1;   // country: real towns only; closer in: every place
  for (const pie of pies.values()) pie.el.classList.toggle("pie-hide", pie.total < min);
}
let pieCard = null;
// City card: "Київ · 1553", then one row per status the city actually has. Tinted when every bot agrees.
function pieCardHtml(city, s) {
  // same words, "31% · 449" layout and shares as the panel: on/off out of bots with a status, "no data" out of all
  const line = (state, label, n, of) => `<div class="pie-row"><span class="dot ${state}"></span><span>${label}</span><span class="n"><span class="cnt-n">${n}</span><span class="pct">${Math.round(n / of * 100)}%</span></span></div>`;
  const rows = [["off", "Світла немає", s.off], ["on", "Світло є", s.on]].filter(r => r[2]).sort((a, b) => b[2] - a[2])
    .map(r => line(...r, s.known));
  if (s.idle) rows.push(line("idle", "Немає даних", s.idle, s.total));
  const tint = !s.off && s.on ? "st-on" : !s.on && s.off ? "st-off" : "";
  return { tint, html: `<div class="pop"><section class="pop-item ${tint}">
    <div class="pop-state pie-head"><b>${esc(city)}</b><span>· ${s.total}</span></div>
    ${rows.join("")}
  </section></div>` };
}
function showPieCard(city) {
  const pie = pies.get(city);
  if (!pie) return;
  const card = pieCardHtml(city, summarize(pie.list));
  fadeOut(pieCard);
  pieCard = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: pie.el.offsetWidth / 2 + 6, maxWidth: "260px", className: "hover-pop" })
    .setLngLat(pie.marker.getLngLat()).setHTML(card.html).addTo(map);
  if (card.tint) pieCard.addClassName(card.tint);
}
map.on("zoom", updatePies);

let idleTimer;
map.on("idle", () => { clearTimeout(idleTimer); idleTimer = setTimeout(matchBuildings, 50); });

// ---------- UI ----------
// Collapsed panel keeps its top part (city + headline) in place and shrinks around it.
const side = document.getElementById("side");
function measureMini() {
  const sum = document.getElementById("summary");
  side.style.setProperty("--mini-h", sum.offsetTop + sum.offsetHeight + 16 + "px");
}
function setSide(open) {
  if (!open) { measureMini(); side.scrollTop = 0; }
  side.classList.toggle("collapsed", !open);
  const t = document.getElementById("toggle");
  t.setAttribute("aria-expanded", String(open));
  t.setAttribute("aria-label", open ? "Згорнути панель" : "Розгорнути панель");
  try { localStorage.setItem("svitlo-side", open ? "1" : "0"); } catch {}
}
document.getElementById("toggle").onclick = () => setSide(side.classList.contains("collapsed"));

// Phone sheet: it follows the finger and snaps open or compact on release. It can be dragged by the grabber,
// or anywhere on the sheet: down when its content is scrolled to the top, up when it is compact.
{
  const grab = document.getElementById("grab");
  let drag = null;
  const start = (y, t) => {
    if (side.classList.contains("collapsed")) measureMini();
    const mini = parseFloat(side.style.getPropertyValue("--mini-h"));
    drag = { y, t, lastY: y, lastT: t, v: 0, h: side.offsetHeight, mini, full: Math.max(mini, innerHeight - 52), moved: false };
  };
  const move = (y, t) => {
    const dy = y - drag.y;
    if (!drag.moved && Math.abs(dy) < 4) return false;
    if (!drag.moved) { drag.moved = true; side.classList.add("dragging"); side.scrollTop = 0; }
    side.style.height = Math.min(drag.full, Math.max(drag.mini, drag.h - dy)) + "px";
    side.classList.toggle("collapsed", side.offsetHeight < drag.mini + 24);   // the rest fades in as soon as it is pulled up
    if (t > drag.lastT) drag.v = (y - drag.lastY) / (t - drag.lastT);   // px per ms, + is down
    drag.lastY = y; drag.lastT = t;
    return true;
  };
  const end = (t, tapToggles) => {
    const d = drag; drag = null;
    if (!d) return;
    if (!d.moved) { if (tapToggles) setSide(side.classList.contains("collapsed")); return; }
    const v = t - d.lastT > 120 ? 0 : d.v;   // a pause before letting go means no flick
    const open = v < -0.3 ? true : v > 0.3 ? false : side.offsetHeight > (d.mini + d.full) / 2;
    side.classList.remove("dragging");
    void side.offsetHeight;   // let the snap animate from where the finger left it
    side.style.height = "";
    setSide(open);
  };

  grab.addEventListener("pointerdown", e => { start(e.clientY, e.timeStamp); grab.setPointerCapture(e.pointerId); });
  grab.addEventListener("pointermove", e => { if (drag) move(e.clientY, e.timeStamp); });
  grab.addEventListener("pointerup", e => end(e.timeStamp, true));
  grab.addEventListener("pointercancel", e => end(e.timeStamp, false));
  grab.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setSide(side.classList.contains("collapsed")); } });

  // Body of the sheet (touch only). Scrolling wins until the content is at the top.
  let touch = null;
  side.addEventListener("touchstart", e => {
    if (!matchMedia("(max-width: 560px)").matches || e.touches.length !== 1 || e.target.closest("#grab, .results")) return;
    touch = { y: e.touches[0].clientY, t: e.timeStamp, top: side.scrollTop };
  }, { passive: true });
  side.addEventListener("touchmove", e => {
    if (!touch) return;
    const y = e.touches[0].clientY, dy = y - touch.y;
    if (!drag) {
      const collapsed = side.classList.contains("collapsed");
      const pullDown = dy > 4 && !collapsed && side.scrollTop <= 0 && touch.top <= 0;
      const pullUp = dy < -4 && collapsed;
      if (!pullDown && !pullUp) { if (Math.abs(dy) > 4) touch = null; return; }   // let it scroll normally
      start(touch.y, touch.t);
    }
    if (move(y, e.timeStamp)) e.preventDefault();
  }, { passive: false });
  const touchEnd = e => { touch = null; if (drag) end(e.timeStamp, false); };
  side.addEventListener("touchend", touchEnd);
  side.addEventListener("touchcancel", touchEnd);
}

{
  let open = !matchMedia("(max-width: 560px)").matches;
  try { const v = localStorage.getItem("svitlo-side"); if (v) open = v === "1"; } catch {}
  setSide(open);
}
document.getElementById("refresh").onclick = loadBots;

// Typeahead list under an input: arrows move, Enter picks, Esc closes.
function combobox(input, list, { getItems, onPick, onClose }) {
  let items = [], active = -1;
  const open = () => {
    items = getItems(input.value.trim().toLowerCase());
    active = items.length ? 0 : -1;
    list.innerHTML = "";
    list.scrollTop = 0;
    if (!items.length && input.value.trim().length < 2) { close(); return; }
    if (!items.length) list.innerHTML = '<li class="none">Нічого не знайдено</li>';
    active = items.findIndex(it => !it.header);
    items.forEach((it, i) => {
      const li = document.createElement("li");
      if (it.header) { li.className = "grp"; li.setAttribute("role", "presentation"); li.textContent = it.header; li.onmousedown = e => e.preventDefault(); }
      else { li.setAttribute("role", "option"); li.innerHTML = it.html; li.onmousedown = e => { e.preventDefault(); pick(i); }; }
      list.appendChild(li);
    });
    mark();
    list.hidden = false; input.setAttribute("aria-expanded", "true");
  };
  const close = () => { list.hidden = true; input.setAttribute("aria-expanded", "false"); };
  const mark = () => [...list.children].forEach((li, i) => {
    li.setAttribute("aria-selected", String(i === active));
    if (i !== active) return;
    // keep the active option visible by scrolling only the list, never the panel
    if (li.offsetTop < list.scrollTop) list.scrollTop = li.offsetTop - 4;
    else if (li.offsetTop + li.offsetHeight > list.scrollTop + list.clientHeight) list.scrollTop = li.offsetTop + li.offsetHeight - list.clientHeight + 4;
  });
  const pick = i => { if (!items[i] || items[i].header) return; close(); onPick(items[i]); };
  input.addEventListener("input", open);
  input.addEventListener("keydown", e => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      if (list.hidden) return open();
      if (active < 0) return;
      const step = e.key === "ArrowDown" ? 1 : -1;
      do active = (active + step + items.length) % items.length; while (items[active].header);
      mark();
    } else if (e.key === "Enter") { e.preventDefault(); pick(active); }
    else if (e.key === "Escape") { close(); onClose?.(); input.blur(); }
  });
  input.addEventListener("blur", () => { close(); onClose?.(); });
  return { open };
}

// One field for place and address. At rest it shows the current city. Focus empties it and lists every city;
// typing shows matching addresses in the current city and matching cities, in two sections.
let cityOptions = [];
const q = document.getElementById("q");
const cityItem = o => ({ city: o, html: `<span>${esc(o.label)}</span><span class="cnt">${o.count}</span>` });
const box = combobox(q, document.getElementById("results"), {
  getItems: s => {
    if (!s) return cityOptions.slice(0, 80).map(cityItem);
    const seen = new Set();
    const addrs = s.length < 2 ? [] : bots.filter(b => {
      if (seen.has(b.link) || (area && b.city !== area)) return false;
      const hit = b.title.toLowerCase().includes(s) || b.link.toLowerCase().includes(s);
      if (hit) seen.add(b.link);
      return hit;
    }).slice(0, 8).map(bot => {
      const label = area && bot.title.includes("->") ? bot.title.split("->").slice(1).join("->").trim() : bot.title;
      return { bot, html: `<span class="dot ${bot.state}"></span><span>${esc(label)}</span>` };
    });
    const matched = cityOptions.filter(o => o.label.toLowerCase().includes(s));
    const cities = matched.slice(0, 6).map(cityItem);
    const addrPart = addrs.length ? [{ header: area ? "Адреси · " + area : "Адреси" }, ...addrs] : [];
    const cityPart = cities.length ? [{ header: "Міста" }, ...cities] : [];
    // typing the start of a city name puts cities first
    return matched.some(o => o.label.toLowerCase().startsWith(s)) ? [...cityPart, ...addrPart] : [...addrPart, ...cityPart];
  },
  onPick: it => {
    if (it.city) setArea(it.city.value);
    q.value = area ?? "Уся Україна";   // the field always goes back to showing the city
    q.blur();
    if (it.city) return;
    const bot = it.bot;
    revealMap();
    // the card appears at once and rides along with the map as it flies there
    pinPopup(addressGroup(bot), [bot.lng, bot.lat]);
    map.flyTo({ center: [bot.lng, bot.lat], zoom: 17, padding: viewPadding(0) });
  },
  onClose: () => { q.value = area ?? "Уся Україна"; },
});
q.addEventListener("focus", () => { q.value = ""; box.open(); });
q.value = area ?? "Уся Україна";
</script>
