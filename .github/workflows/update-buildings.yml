name: Update building outlines

on:
  schedule:
    - cron: "0 2 * * 0"   # every Sunday, 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild buildings.js
        run: python build_buildings.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- buildings.js; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add buildings.js
          git commit -m "Update building outlines"
          git push
